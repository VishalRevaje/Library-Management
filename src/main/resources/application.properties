server.port=8087

# ---------- MySQL datasource ----------
# The database "courselibrary" is created automatically if it does not exist.
# Change username/password below (or set DB_USERNAME / DB_PASSWORD environment variables).
spring.datasource.url=jdbc:mysql://localhost:3306/courselibrary?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=revaje
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate / Spring Data JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
